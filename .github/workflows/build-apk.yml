name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the web app for offline use
        run: bash scripts/make_offline.sh

      - name: Build APK
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HydrantHoseCoverage-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HydrantHoseCoverage-apk
          path: out/*.apk
